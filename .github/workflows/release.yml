name: Publish Stable Release

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild.
        required: true
        type: string
      replace:
        description: Replace packages in the existing release after successful builds.
        required: true
        type: boolean
        default: false

permissions:
  artifact-metadata: write
  attestations: write
  contents: write
  actions: read
  id-token: write
  packages: write

concurrency:
  group: publish-stable-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    if: github.event_name != 'push' || github.event.created == true
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - name: Validate the tag and synchronized versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          node tools/release.cjs --check "$version"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1 && [[ "${{ inputs.replace }}" != "true" ]]; then
            echo "Release $RELEASE_TAG already exists; use the explicit replacement workflow." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build release packages
    needs: validate
    uses: ./.github/workflows/test.yml
    with:
      release: true
    secrets: inherit

  # One APK per ABI: arm64-v8a for current phones and tablets, armeabi-v7a
  # for 32-bit devices. Two jobs rather than a matrix, because a matrix of
  # reusable-workflow calls keeps only one call's outputs.
  android-arm64:
    name: Build Android APK (arm64-v8a)
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      abi: arm64-v8a
      release: true
    secrets: inherit

  android-armv7:
    name: Build Android APK (armeabi-v7a)
    needs: validate
    uses: ./.github/workflows/android.yml
    with:
      abi: armeabi-v7a
      release: true
    secrets: inherit

  # The image is pushed (and tagged latest) only once every package has
  # built, so a failed build never leaves a published image behind.
  container:
    name: Publish release container
    needs:
      - validate
      - build
      - android-arm64
      - android-armv7
    uses: ./.github/workflows/container-image.yml
    with:
      version: ${{ needs.validate.outputs.version }}
      publish_latest: true

  release:
    name: Publish GitHub release
    needs:
      - validate
      - build
      - android-arm64
      - android-armv7
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mujin-music-*
          path: artifacts
          merge-multiple: true
      - name: Verify exact release package set
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          while IFS= read -r -d '' package; do
            destination="artifacts/$(basename "$package")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release package: $(basename "$package")" >&2
              exit 1
            fi
            mv "$package" "$destination"
          done < <(find artifacts -mindepth 2 -type f -print0)
          require_count() {
            local expected="$1"
            local pattern="$2"
            local actual
            actual="$(find artifacts -maxdepth 1 -type f -name "$pattern" | wc -l)"
            if [[ "$actual" -ne "$expected" ]]; then
              echo "Expected $expected file(s) matching $pattern, found $actual." >&2
              exit 1
            fi
          }
          require_count 2 "Mujin-Music-${VERSION}-*.AppImage"
          require_count 2 "Mujin-Music-${VERSION}-*.deb"
          require_count 2 "Mujin-Music-Setup-${VERSION}-*.exe"
          require_count 2 "Mujin-Music-${VERSION}-*-portable.exe"
          require_count 2 "Mujin-Music-${VERSION}-*.dmg"
          require_count 2 "Mujin-Music-${VERSION}-*.zip"
          require_count 1 "Mujin-Music-Server-${VERSION}-win-x64.zip"
          require_count 1 "ParsonMusicServer.exe"
          require_count 1 "ParsonMusicServer.exe.sha256"
          require_count 1 "windows-server-update.json"
          require_count 1 "Mujin-Music-${VERSION}-android-arm64-v8a.apk"
          require_count 1 "Mujin-Music-${VERSION}-android-armeabi-v7a.apk"
          # Nothing else, apart from electron-builder's .blockmap files.
          total="$(find artifacts -maxdepth 1 -type f ! -name '*.blockmap' | wc -l)"
          if [[ "$total" -ne 18 ]]; then
            echo "Expected 18 release packages, found $total:" >&2
            find artifacts -maxdepth 1 -type f ! -name '*.blockmap' -printf '%f\n' | sort >&2
            exit 1
          fi
          unexpected="$(find artifacts -maxdepth 1 -type f -name '*.blockmap' ! -name "*-${VERSION}-*.blockmap")"
          if [[ -n "$unexpected" ]]; then
            echo "Unexpected block maps: $unexpected" >&2
            exit 1
          fi
      - name: Generate architecture-specific update feeds
        run: node tools/update-metadata.cjs artifacts "${{ needs.validate.outputs.version }}"
      - name: Attest release package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/*.AppImage
            artifacts/*.apk
            artifacts/*.deb
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.json
            artifacts/*.yml
      # Both APKs come from the same secrets, so they are signed alike.
      - name: Write the release notes
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ARM64_SIGNING_KEY: ${{ needs.android-arm64.outputs.signing_key }}
          ARMV7_SIGNING_KEY: ${{ needs.android-armv7.outputs.signing_key }}
          ARM64_CERTIFICATE: ${{ needs.android-arm64.outputs.certificate_sha256 }}
          ARMV7_CERTIFICATE: ${{ needs.android-armv7.outputs.certificate_sha256 }}
        run: |
          if [[ "$ARM64_SIGNING_KEY" != "$ARMV7_SIGNING_KEY" || "$ARM64_CERTIFICATE" != "$ARMV7_CERTIFICATE" ]]; then
            echo "The two Android APKs were not signed with the same key." >&2
            exit 1
          fi
          node tools/release-notes.cjs "$VERSION" "$GITHUB_REPOSITORY" "$ARM64_SIGNING_KEY" "$ARM64_CERTIFICATE" \
            > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPLACE: ${{ inputs.replace }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -d '' packages < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          if [[ "$REPLACE" == "true" ]]; then
            gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber
            # The notes describe the packages (such as the Android signing
            # key), so they are replaced with them.
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${packages[@]}" \
              --target "$GITHUB_SHA" \
              --title "Mujin Music $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
      - name: Validate published release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run published-artifacts.yml --ref master -f "tag=$RELEASE_TAG"
