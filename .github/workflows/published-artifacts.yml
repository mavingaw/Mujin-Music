name: Validate Published Artifacts

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to validate.
        required: true
        type: string
      previous_tag:
        description: Previous stable tag used for upgrade and rollback tests.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: validate-published-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable releases
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      current: ${{ steps.releases.outputs.current }}
      previous: ${{ steps.releases.outputs.previous }}
    steps:
      - name: Resolve current and previous stable tags
        id: releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          REQUESTED_PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          test -n "$CURRENT_TAG"
          release_kind="$(
            gh release view "$CURRENT_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv'
          )"
          test "$release_kind" = $'false\tfalse'
          previous="$REQUESTED_PREVIOUS_TAG"
          if [[ -z "$previous" ]]; then
            previous="$(
              gh release list --repo "$GITHUB_REPOSITORY" \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 100 \
                --json tagName \
                --jq '.[].tagName' |
                grep -Fxv "$CURRENT_TAG" |
                head -1 || true
            )"
          fi
          if [[ -n "$previous" ]]; then
            gh release view "$previous" --repo "$GITHUB_REPOSITORY" >/dev/null
          fi
          {
            echo "current=$CURRENT_TAG"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  linux:
    name: Linux install, upgrade, rollback (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            appimage_arch: x86_64
            deb_arch: amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            appimage_arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Download exact published Linux artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Mujin-Music-${version}-${{ matrix.appimage_arch }}.AppImage" \
            --pattern "Mujin-Music-${version}-${{ matrix.deb_arch }}.deb"
      - name: Exercise AppImage installation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find . -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$appimage"
          gh attestation verify "$appimage" --repo "$GITHUB_REPOSITORY"
          gh attestation verify "$deb" --repo "$GITHUB_REPOSITORY"
          chmod +x "$appimage"
          sudo apt-get update
          sudo apt-get install -y "$deb" xvfb
          package="$(dpkg-deb -f "$deb" Package)"
          sudo apt-get remove -y "$package"
          test_root="$(mktemp -d -t parson-published-appimage-XXXXXX)"
          export HOME="$test_root/home"
          export XDG_DATA_HOME="$test_root/share"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          timeout 45s "$appimage" --appimage-extract >/dev/null
          test -s squashfs-root/resources/LICENSE
          test -s squashfs-root/resources/THIRD_PARTY_NOTICES.md
          rm -rf squashfs-root
          set +e
          timeout 45s xvfb-run -a "$appimage" --install
          status="$?"
          set -e
          if [[ "$status" -ne 0 && "$status" -ne 124 ]]; then
            echo "AppImage installer exited with status $status." >&2
            exit "$status"
          fi
          installed="$HOME/.local/opt/parson/Parson.AppImage"
          test -x "$installed"
          cmp "$appimage" "$installed"
          pkill -f "$installed" || true
      - name: Exercise Debian install, upgrade, and rollback
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.resolve.outputs.current }}
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous }}
        run: |
          current_deb="$(find . -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$current_deb"
          package="$(dpkg-deb -f "$current_deb" Package)"
          sudo apt-get update
          if [[ -n "$PREVIOUS_TAG" ]]; then
            previous_version="${PREVIOUS_TAG#v}"
            # Releases before the Mujin Music rename are a different package
            # (Parson_*.deb); upgrade and rollback are tested between Mujin
            # Music releases only.
            if gh release download "$PREVIOUS_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern "Mujin-Music-${previous_version}-${{ matrix.deb_arch }}.deb"; then
              previous_deb="$(
                find . -maxdepth 1 -name "Mujin-Music-${previous_version}-*.deb" -print -quit
              )"
              sudo apt-get install -y "$previous_deb"
            else
              echo "::warning::$PREVIOUS_TAG predates the Mujin Music packages; skipping upgrade and rollback."
              PREVIOUS_TAG=""
            fi
          fi
          sudo apt-get install -y "$current_deb"
          test "$(dpkg-query -W -f='${Status}' "$package")" = "install ok installed"
          dpkg-query -L "$package" | grep -q '/resources/LICENSE$'
          sudo apt-get install -y --reinstall "$current_deb"
          if [[ -n "$PREVIOUS_TAG" ]]; then
            sudo apt-get install -y --allow-downgrades "$previous_deb"
            test "$(dpkg-query -W -f='${Version}' "$package")" = "${PREVIOUS_TAG#v}"
          fi
          sudo apt-get remove -y "$package"

  windows:
    name: Windows installer lifecycle (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Download exact published Windows artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          $version = $env:TAG.TrimStart("v")
          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern "Mujin-Music-Setup-${version}-${{ matrix.arch }}.exe" `
            --pattern "Mujin-Music-${version}-${{ matrix.arch }}-portable.exe"
      - name: Verify provenance and exercise installer lifecycle
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURRENT_TAG: ${{ needs.resolve.outputs.current }}
          PREVIOUS_TAG: ${{ needs.resolve.outputs.previous }}
        run: |
          $installer = Get-ChildItem "Mujin-Music-Setup-*.exe" | Select-Object -First 1
          $portable = Get-ChildItem "Mujin-Music-*-portable.exe" | Select-Object -First 1
          foreach ($artifact in @($installer, $portable)) {
            gh attestation verify $artifact.FullName --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "$($artifact.Name) has no valid build provenance."
            }
          }
          function Wait-InstalledVersion {
            param([string]$Directory, [string]$Version, [switch]$RequirePayload)
            $expected = [Version]$Version
            $executable = Join-Path $Directory "Mujin Music.exe"
            $deadline = (Get-Date).AddMinutes(2)
            do {
              if (Test-Path -LiteralPath $executable) {
                try {
                  $productVersion = (Get-Item -LiteralPath $executable).VersionInfo.ProductVersion
                  $actual = [Version](($productVersion -split '[+\s]')[0])
                  $matches = $actual.Major -eq $expected.Major -and
                    $actual.Minor -eq $expected.Minor -and $actual.Build -eq $expected.Build
                  $payloadReady = -not $RequirePayload -or @(
                    "resources\LICENSE",
                    "resources\THIRD_PARTY_NOTICES.md",
                    "resources\app.asar",
                    "resources\parson-music-server.exe",
                    "Uninstall Mujin Music.exe"
                  ).Where({ -not (Test-Path -LiteralPath (Join-Path $Directory $_)) }).Count -eq 0
                  if ($matches -and $payloadReady) { return $executable }
                } catch {
                  Write-Host "Waiting for the installed executable to be ready."
                }
              }
              Start-Sleep -Seconds 2
            } while ((Get-Date) -lt $deadline)
            Get-ChildItem -LiteralPath $Directory -Recurse -ErrorAction SilentlyContinue |
              Select-Object FullName | Format-Table | Out-Host
            foreach ($registryRoot in @(
              "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
              "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
              "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
            )) {
              Get-ChildItem $registryRoot -ErrorAction SilentlyContinue |
                ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
                Where-Object DisplayName -eq "Mujin Music" |
                Select-Object DisplayName, DisplayVersion, InstallLocation | Format-Table | Out-Host
            }
            Get-MpThreatDetection -ErrorAction SilentlyContinue |
              Select-Object ThreatID, InitialDetectionTime, Resources | Format-List | Out-Host
            Get-WinEvent -FilterHashtable @{
              LogName = "Microsoft-Windows-Windows Defender/Operational"
              Id = 1116, 1117
            } -MaxEvents 10 -ErrorAction SilentlyContinue |
              Select-Object TimeCreated, Message | Format-List | Out-Host
            throw "Mujin Music $Version was not installed successfully in $Directory."
          }
          $currentVersion = $env:CURRENT_TAG.TrimStart("v")
          $install = Join-Path $env:RUNNER_TEMP "ParsonLifecycle"
          $arguments = @("/S", "/D=$install")
          $process = Start-Process $installer.FullName -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Fresh installation failed." }
          Wait-InstalledVersion $install $currentVersion -RequirePayload | Out-Null
          $brokenPreviousArmInstaller = $false
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) {
            $previousVersion = $env:PREVIOUS_TAG.TrimStart("v")
            # Releases before the Mujin Music rename are a different app
            # (another app id); upgrade and rollback are tested between Mujin
            # Music releases only.
            gh release download $env:PREVIOUS_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --pattern "Mujin-Music-Setup-${previousVersion}-${{ matrix.arch }}.exe"
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::warning::$($env:PREVIOUS_TAG) predates the Mujin Music installers; skipping upgrade and rollback."
              $global:LASTEXITCODE = 0
              $env:PREVIOUS_TAG = ""
            }
          }
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG)) {
            $previous = Get-Item "Mujin-Music-Setup-${previousVersion}-${{ matrix.arch }}.exe"
            $process = Start-Process $previous.FullName -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Previous release installation failed." }
            $brokenPreviousArmInstaller = "${{ matrix.arch }}" -eq "arm64" -and $previousVersion -eq "1.0.0"
            if ($brokenPreviousArmInstaller) {
              Write-Host "::warning::The 1.0.0 ARM installer cannot extract executable files. Testing recovery with the current installer; rollback to this broken package is excluded."
            } else {
              Wait-InstalledVersion $install $previousVersion | Out-Null
            }
          }
          $process = Start-Process $installer.FullName -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Current release installation failed." }
          $installed = Wait-InstalledVersion $install $currentVersion -RequirePayload
          foreach ($relativePath in @(
            "resources\LICENSE",
            "resources\THIRD_PARTY_NOTICES.md"
          )) {
            if (-not (Test-Path (Join-Path $install $relativePath))) {
              throw "Installed application is missing $relativePath."
            }
          }
          $process = Start-Process $installer.FullName -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "In-place upgrade failed." }
          Wait-InstalledVersion $install $currentVersion -RequirePayload | Out-Null
          if (-not [string]::IsNullOrWhiteSpace($env:PREVIOUS_TAG) -and -not $brokenPreviousArmInstaller) {
            $process = Start-Process $previous.FullName -ArgumentList $arguments -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Rollback installation failed." }
            Wait-InstalledVersion $install $previousVersion | Out-Null
          }
          $uninstaller = Join-Path $install "Uninstall Mujin Music.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller is missing." }
          $process = Start-Process $uninstaller -ArgumentList "/S" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Uninstall failed." }
          $deadline = (Get-Date).AddMinutes(2)
          while ((Test-Path -LiteralPath $installed) -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 2
          }
          if (Test-Path -LiteralPath $installed) { throw "Installed executable remains after uninstall." }

  macos:
    name: macOS install and startup (${{ matrix.arch }})
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            executable_arch: x86_64
            runner: macos-15-intel
          - arch: arm64
            executable_arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Download exact published macOS artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Mujin-Music-${version}-${{ matrix.arch }}.dmg" \
            --pattern "Mujin-Music-${version}-${{ matrix.arch }}.zip"
      - name: Verify provenance, architecture, and payload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          version="${TAG#v}"
          dmg="Mujin-Music-${version}-${{ matrix.arch }}.dmg"
          zip="Mujin-Music-${version}-${{ matrix.arch }}.zip"
          for artifact in "$dmg" "$zip"; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

          mount_point="$RUNNER_TEMP/ParsonDMG"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg" \
            -nobrowse \
            -readonly \
            -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" >/dev/null 2>&1 || true' EXIT
          app="$mount_point/Mujin Music.app"

          for path in \
            "$app/Contents/Resources/LICENSE" \
            "$app/Contents/Resources/THIRD_PARTY_NOTICES.md" \
            "$app/Contents/Resources/app.asar"; do
            test -s "$path"
          done
          for executable in \
            "$app/Contents/MacOS/Mujin Music" \
            "$app/Contents/Resources/parson-music-server"; do
            lipo -archs "$executable" |
              tr ' ' '\n' |
              grep -Fqx "${{ matrix.executable_arch }}"
          done

          zip_root="$RUNNER_TEMP/ParsonZIP"
          ditto -x -k "$zip" "$zip_root"
      - name: Start the installed macOS application and embedded server
        env:
          PARSON_PORT: "1993"
        run: |
          installed_root="$RUNNER_TEMP/ParsonApplications"
          data_root="$RUNNER_TEMP/ParsonData"
          mkdir -p "$installed_root" "$data_root"
          ditto "$RUNNER_TEMP/ParsonZIP/Mujin Music.app" "$installed_root/Mujin Music.app"
          export PARSON_DATA_DIR="$data_root"
          "$installed_root/Mujin Music.app/Contents/MacOS/Mujin Music" --disable-gpu \
            >"$RUNNER_TEMP/parson-macos.log" 2>&1 &
          app_pid="$!"
          trap 'kill "$app_pid" >/dev/null 2>&1 || true' EXIT
          for _ in {1..60}; do
            if curl --fail --silent \
              "http://127.0.0.1:${PARSON_PORT}/health" >/dev/null; then
              exit 0
            fi
            if ! kill -0 "$app_pid" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/parson-macos.log"
              exit 1
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/parson-macos.log"
          exit 1

  android:
    name: Android APK provenance and contents
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download exact published Android APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Mujin-Music-${version}-android-*.apk"
      - name: Verify provenance, signature, version and ABI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          version="${TAG#v}"
          IFS=. read -r major minor patch <<<"$version"
          version_code=$((major * 1000000 + minor * 1000 + patch))
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for abi in arm64-v8a armeabi-v7a; do
            apk="Mujin-Music-${version}-android-${abi}.apk"
            gh attestation verify "$apk" --repo "$GITHUB_REPOSITORY"
            "$build_tools/apksigner" verify --print-certs "$apk"
            # Captured first: under pipefail, a reader that stops early
            # (head, grep -q) can fail the step with SIGPIPE.
            badging="$("$build_tools/aapt2" dump badging "$apk")"
            package_line="$(head -n 1 <<<"$badging")"
            echo "$package_line"
            for expected in "name='music.mujin.app'" "versionCode='${version_code}'" "versionName='${version}'"; do
              if [[ "$package_line" != *" $expected"* ]]; then
                echo "$apk does not have $expected." >&2
                exit 1
              fi
            done
            listing="$(unzip -l "$apk")"
            if ! grep -q "lib/${abi}/" <<<"$listing"; then
              echo "$apk has no native libraries for ${abi}." >&2
              exit 1
            fi
          done

  container:
    name: Server container provenance and startup
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify multi-architecture image and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          gh attestation verify "oci://${image}" --repo "$GITHUB_REPOSITORY"
          docker buildx imagetools inspect "$image" --raw > "$RUNNER_TEMP/manifest.json"
          jq --exit-status '
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest")] as $images |
            ($images | length) == 2 and
            all($images[]; .platform.os == "linux") and
            ([$images[].platform.architecture] | sort) == ["amd64", "arm64"]
          ' "$RUNNER_TEMP/manifest.json"
      - name: Start the published server image
        env:
          TAG: ${{ needs.resolve.outputs.current }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          docker run --detach \
            --name parson-published-server \
            --publish 127.0.0.1:1993:1993 \
            "$image"
          trap 'docker rm --force parson-published-server >/dev/null' EXIT
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:1993/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs parson-published-server
          exit 1
