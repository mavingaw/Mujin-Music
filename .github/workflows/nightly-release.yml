name: Publish Nightly Release

on:
  push:
    branches:
      - nightly
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-nightly-release
  cancel-in-progress: false

jobs:
  build:
    name: Build release packages
    # .gitea/workflows/nightly-release.yml once BUILDS_ON is "gitea".
    if: vars.BUILDS_ON != 'gitea'
    uses: ./.github/workflows/test.yml
    with:
      release: true

  release:
    name: GitHub nightly release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Download release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: mujin-music-*
          path: artifacts
          merge-multiple: true
      - name: Verify release package set
        run: |
          while IFS= read -r -d '' package; do
            destination="artifacts/$(basename "$package")"
            if [[ -e "$destination" ]]; then
              echo "Duplicate release package: $(basename "$package")" >&2
              exit 1
            fi
            mv "$package" "$destination"
          done < <(find artifacts -mindepth 2 -type f -print0)
          # The standalone server's one-click update files name the stable
          # release's download URL, so they belong to stable releases only;
          # a nightly ships just its zip.
          rm -f \
            artifacts/ParsonMusicServer.exe \
            artifacts/ParsonMusicServer.exe.sha256 \
            artifacts/windows-server-update.json
          test "$(find artifacts -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name 'Mujin-Music-Setup-*.exe' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*-portable.exe' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name 'Mujin-Music-*.zip' ! -name 'Mujin-Music-Server-*' | wc -l)" -eq 2
          test "$(find artifacts -maxdepth 1 -type f -name 'Mujin-Music-Server-*-win-x64.zip' | wc -l)" -eq 1
          test "$(find artifacts -maxdepth 1 -type f ! -name '*.blockmap' | wc -l)" -eq 13
      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes
          fi
          git tag --force nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly --force
          mapfile -d '' packages < <(find artifacts -maxdepth 1 -type f -print0 | sort -z)
          gh release create nightly "${packages[@]}" \
            --target "$GITHUB_SHA" \
            --title "Mujin Music Nightly" \
            --notes "Automated nightly desktop packages for Linux, macOS, and Windows, and the Windows server-only package." \
            --prerelease
