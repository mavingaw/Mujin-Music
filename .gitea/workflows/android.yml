# Android APKs on the project's Gitea runners (job image from
# deploy/runner-images/linux, which carries the JDK, the Android SDK, the NDK
# and CMake). The Gitea counterpart of .github/workflows/android.yml.
#
# The release reads which key signed an APK from the APK itself
# (release.yml), so this workflow declares no outputs.
name: Android

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      abi:
        description: Native ABI to build (armeabi-v7a for 32-bit devices such as the Echo Show 8)
        type: choice
        options:
          - arm64-v8a
          - armeabi-v7a
        default: arm64-v8a
  # The stable release (release.yml) builds one APK per ABI through this.
  workflow_call:
    inputs:
      abi:
        description: Native ABI to build, arm64-v8a or armeabi-v7a.
        type: string
        default: arm64-v8a
      release:
        description: >-
          Build a release asset: the APK is named
          Mujin-Music-<version>-android-<abi>.apk whichever key signs it.
        type: boolean
        default: false

# The ABI is part of the group: the release calls this workflow once per
# ABI in the same run, and those builds must not cancel each other. A
# release build is never cancelled by a later push.
concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.abi || 'arm64-v8a' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  apk:
    name: Android app (${{ inputs.abi || 'arm64-v8a' }})
    runs-on: linux-x64
    # One ABI keeps the native build (Reanimated, Worklets, Screens, the audio
    # engine) to about a quarter of a universal build: arm64-v8a covers every
    # Android phone and tablet still in use. A cold build, which also installs
    # the NDK, takes roughly 25-35 minutes; with a warm Gradle cache, less.
    timeout-minutes: 60
    env:
      ANDROID_ABI: ${{ inputs.abi || 'arm64-v8a' }}
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check the requested ABI
        run: |
          case "$ANDROID_ABI" in
            arm64-v8a | armeabi-v7a) ;;
            *)
              echo "Unsupported Android ABI: $ANDROID_ABI (use arm64-v8a or armeabi-v7a)." >&2
              exit 1
              ;;
          esac
      # Bun, Node (Metro bundles with it during the Gradle build), JDK 21
      # and the Android SDK come with the job image.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: bunx expo prebuild --platform android --clean --no-install
      # The Gradle files only exist after prebuild, so the cache key is
      # computed from the generated project (it changes with Expo, React
      # Native and the config plugins).
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
          key: gradle-linux-x64-${{ hashFiles('apps/mobile/android/**/*.gradle', 'apps/mobile/android/**/*.gradle.kts', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'bun.lock') }}
          restore-keys: |
            gradle-linux-x64-
      # Release builds are signed with the upload key when the repository has
      # the four ANDROID_UPLOAD_* secrets. Without them (forks, or before the
      # key is configured) the same release build is signed with the debug
      # key that prebuild copies from Expo's project template
      # (expo/template.tgz, android/app/debug.keystore). That key is the
      # same in every run, so these APKs update each other in place, but it
      # is publicly known, and an install signed with it cannot be updated
      # by an APK signed with the upload key (or the other way round). CI
      # artifacts say so in their name; a release names its APKs plainly
      # and says so in the release notes.
      - name: Choose the release signing key
        id: signing
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          present=0
          for value in "$UPLOAD_KEYSTORE_BASE64" "$UPLOAD_STORE_PASSWORD" "$UPLOAD_KEY_ALIAS" "$UPLOAD_KEY_PASSWORD"; do
            if [[ -n "$value" ]]; then present=$((present + 1)); fi
          done
          if [[ "$present" -eq 4 ]]; then
            keystore="$RUNNER_TEMP/mujin-music-upload.keystore"
            printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
            {
              echo "kind=release"
              echo "store-file=$keystore"
              echo "suffix="
            } >> "$GITHUB_OUTPUT"
          elif [[ "$present" -eq 0 ]]; then
            echo "::notice::No Android upload key is configured; the APK is a release build signed with the debug key."
            {
              echo "kind=debug"
              echo "store-file=debug.keystore"
              echo "suffix=-debug-signed"
            } >> "$GITHUB_OUTPUT"
          else
            echo "::error::Only $present of the 4 ANDROID_UPLOAD_* secrets are set. Set all of ANDROID_UPLOAD_KEYSTORE_BASE64, ANDROID_UPLOAD_STORE_PASSWORD, ANDROID_UPLOAD_KEY_ALIAS and ANDROID_UPLOAD_KEY_PASSWORD, or none." >&2
            exit 1
          fi
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # Read by plugins/with-android-release-signing.js; a relative store
          # file resolves against android/app, where prebuild writes
          # debug.keystore.
          ORG_GRADLE_PROJECT_PARSON_UPLOAD_STORE_FILE: ${{ steps.signing.outputs.store-file }}
          ORG_GRADLE_PROJECT_PARSON_UPLOAD_STORE_PASSWORD: ${{ steps.signing.outputs.kind == 'release' && secrets.ANDROID_UPLOAD_STORE_PASSWORD || 'android' }}
          ORG_GRADLE_PROJECT_PARSON_UPLOAD_KEY_ALIAS: ${{ steps.signing.outputs.kind == 'release' && secrets.ANDROID_UPLOAD_KEY_ALIAS || 'androiddebugkey' }}
          ORG_GRADLE_PROJECT_PARSON_UPLOAD_KEY_PASSWORD: ${{ steps.signing.outputs.kind == 'release' && secrets.ANDROID_UPLOAD_KEY_PASSWORD || 'android' }}
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            -PreactNativeArchitectures="$ANDROID_ABI"
      - name: Verify the APK (signature, version, ABI, embedded bundle)
        id: verify
        env:
          SIGNING_KIND: ${{ steps.signing.outputs.kind }}
          # A release asset is named plainly; the release notes say which
          # key signed it.
          SUFFIX: ${{ !inputs.release && steps.signing.outputs.suffix || '' }}
          # SHA-256 of the certificate in Expo's template debug.keystore
          # (CN=Android Debug). If a template update ever changed the key,
          # debug-signed APKs could no longer update earlier installs.
          TEMPLATE_DEBUG_CERTIFICATE: fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c
        run: |
          set -euo pipefail
          apk=apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          certificates="$("$build_tools/apksigner" verify --print-certs "$apk")"
          echo "$certificates"
          digests="$(sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]\{64\}\).*/\1/p' <<<"$certificates" | sort -u)"
          if [[ "$(wc -l <<<"$digests")" -ne 1 || -z "$digests" ]]; then
            echo "Expected exactly one signing certificate, found: ${digests:-none}" >&2
            exit 1
          fi
          if [[ "$SIGNING_KIND" == "debug" && "$digests" != "$TEMPLATE_DEBUG_CERTIFICATE" ]]; then
            echo "The debug-signed APK is not signed with the Expo template's debug key ($digests)." >&2
            exit 1
          fi
          if [[ "$SIGNING_KIND" == "release" && "$digests" == "$TEMPLATE_DEBUG_CERTIFICATE" ]]; then
            echo "The upload key secrets hold the public debug key; use a private upload key." >&2
            exit 1
          fi
          echo "certificate-sha256=$digests" >> "$GITHUB_OUTPUT"
          # versionName and versionCode come from app.json, which
          # tools/release.cjs keeps in step with the release version.
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          version_code="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          badging="$("$build_tools/aapt2" dump badging "$apk")"
          package_line="$(head -n 1 <<<"$badging")"
          echo "$package_line"
          for expected in "name='music.mujin.app'" "versionCode='${version_code}'" "versionName='${version}'"; do
            if [[ "$package_line" != *" $expected"* ]]; then
              echo "The APK does not have $expected." >&2
              exit 1
            fi
          done
          listing="$(unzip -l "$apk")"
          grep -q "lib/${ANDROID_ABI}/" <<<"$listing" || {
            echo "The APK has no native libraries for ${ANDROID_ABI}." >&2
            exit 1
          }
          if grep -E "lib/(arm64-v8a|armeabi-v7a|x86|x86_64)/" <<<"$listing" | grep -v "lib/${ANDROID_ABI}/"; then
            echo "::warning::The APK also contains native libraries for ABIs other than ${ANDROID_ABI}."
          fi
          grep -q "assets/index.android.bundle" <<<"$listing" || {
            echo "The APK does not embed the JavaScript bundle." >&2
            exit 1
          }
          name="Mujin-Music-${version}-android-${ANDROID_ABI}${SUFFIX}.apk"
          mkdir -p artifacts/android
          cp "$apk" "artifacts/android/$name"
          ls -l artifacts/android
      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: mujin-music-android-${{ env.ANDROID_ABI }}${{ !inputs.release && steps.signing.outputs.suffix || '' }}
          path: artifacts/android/*.apk
          if-no-files-found: error
